<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Investigation Center</title>
<style>
:root {
  color-scheme: light;
  --page:#f9f9f7; --panel:#fcfcfb; --raised:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --line2:#c3c2b7; --accent:#2a78d6; --accent-soft:#e8f1fc;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#8a5a00; --serious:#ec835a; --bad:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --neutral:#898781;
  --ring:rgba(11,11,11,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:#0d0d0d; --panel:#1a1a19; --raised:#222220; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --line2:#383835; --accent:#3987e5; --accent-soft:#16263a;
    --good-text:#0ca30c; --warn-text:#fab219; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ring:rgba(255,255,255,0.10);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --panel:#1a1a19; --raised:#222220; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --line2:#383835; --accent:#3987e5; --accent-soft:#16263a;
  --good-text:#0ca30c; --warn-text:#fab219; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --ring:rgba(255,255,255,0.10);
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--page); color:var(--ink); }
body { font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
code, .mono { font:12px/1.4 ui-monospace, Menlo, monospace; word-break:break-all; }
.app { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
nav { background:var(--panel); border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; overflow:auto; }
.brand { font-weight:650; font-size:15px; padding:0 8px 2px; }
.brand small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
nav a.item { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; border-radius:6px; color:var(--ink2); margin:1px 0; }
nav a.item:hover { background:var(--accent-soft); text-decoration:none; }
nav a.item.on { background:var(--accent-soft); color:var(--ink); font-weight:600; }
nav .sep { height:1px; background:var(--line); margin:12px 6px; }
nav .count { font-size:11px; background:var(--bad); color:#fff; border-radius:99px; padding:0 7px; }
nav .status { margin:14px 8px 0; font-size:12px; color:var(--muted); }
main { padding:24px clamp(16px, 3vw, 36px) 60px; max-width:1320px; width:100%; }
h1 { font-size:22px; margin:0 0 4px; font-weight:650; letter-spacing:-0.01em; }
h2 { font-size:15px; margin:0 0 10px; font-weight:650; }
h3 { font-size:14px; margin:14px 0 6px; font-weight:650; }
.sub { color:var(--ink2); margin:0 0 18px; }
.grid { display:grid; gap:14px; }
.g2 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 430px), 1fr)); }
.g3 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.tiles { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); margin-bottom:14px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.tile .v { font-size:26px; font-weight:650; line-height:1.15; }
.tile .k { color:var(--ink2); font-size:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
.card.click { cursor:pointer; } .card.click:hover { border-color:var(--line2); }
.lead { font-size:15px; line-height:1.6; }
.muted { color:var(--muted); } .ink2 { color:var(--ink2); } .small { font-size:12px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.spread { display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; }
.badge { display:inline-flex; gap:4px; align-items:center; font-size:11.5px; font-weight:600; padding:1px 8px; border-radius:99px; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap; }
.b-good { color:var(--good-text); border-color:var(--good); } .b-warn { color:var(--warn-text); border-color:var(--warn); }
.b-bad { color:var(--bad); border-color:var(--bad); } .b-accent { color:var(--accent); border-color:var(--accent); }
.b-solid-bad { background:var(--bad); color:#fff; border-color:var(--bad); }
.b-signal { color:var(--warn-text); border:1px dashed var(--warn); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; }
tr.click { cursor:pointer; } tr.click:hover td { background:var(--accent-soft); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.scroll { overflow-x:auto; }
.empty { color:var(--muted); font-style:italic; padding:6px 0; }
.list { margin:0; padding-left:18px; } .list li { margin:3px 0; }
details { border-top:1px solid var(--line); padding:6px 0; } details > summary { cursor:pointer; color:var(--ink2); }
.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.tier { font-size:11px; font-weight:700; letter-spacing:0.02em; }
.t-CONFIRMED { color:var(--good-text); } .t-SUPPORTED { color:var(--accent); } .t-REFUTED { color:var(--bad); }
.t-HYPOTHESIS, .t-UNRESOLVED { color:var(--muted); }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.health { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); }
.health .h { border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:var(--raised); }
.att { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.att:last-child { border-bottom:0; }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar > i { display:block; height:100%; background:var(--accent); border-radius:3px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; align-items:center; }
select, input, textarea, button { font:inherit; color:var(--ink); background:var(--raised); border:1px solid var(--line2); border-radius:7px; padding:6px 9px; }
textarea { width:100%; min-height:110px; resize:vertical; }
button { cursor:pointer; font-weight:600; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button:disabled { opacity:.5; cursor:not-allowed; }
a.btn { border:1px solid var(--line2); border-radius:7px; padding:6px 10px; font-weight:600; background:var(--raised); }
.seg button { border-radius:0; margin-left:-1px; font-weight:500; } .seg button:first-child { border-radius:7px 0 0 7px; } .seg button:last-child { border-radius:0 7px 7px 0; }
.seg button.on { background:var(--accent-soft); color:var(--ink); font-weight:650; }
.report { background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:18px 22px; max-width:960px; }
.report h3 { font-size:16px; margin:0 0 12px; }
.report p { margin:8px 0; } .report ul { margin:4px 0 10px; padding-left:20px; } .report li { margin:3px 0; }
.kv { display:grid; grid-template-columns:180px 1fr; gap:6px 14px; } .graphwrap .kv { grid-template-columns:96px 1fr; } .kv > div:nth-child(odd) { color:var(--muted); font-size:12.5px; }
.graphwrap { position:relative; display:grid; grid-template-columns:1fr 340px; gap:14px; }
svg.graph { width:100%; height:68vh; min-height:420px; background:var(--panel); border:1px solid var(--line); border-radius:10px; touch-action:none; cursor:grab; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin:0 0 10px; align-items:center; }
.legend svg { vertical-align:middle; }
.notice { border-left:3px solid var(--warn); background:var(--raised); padding:8px 12px; border-radius:0 8px 8px 0; color:var(--ink2); margin:0 0 14px; font-size:13px; }
.err { border-left-color:var(--bad); }
.tree { border-left:2px solid var(--line); margin-left:6px; padding-left:12px; }
pre.raw { background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; max-height:70vh; font:12px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
@media (max-width: 860px) {
  .app { grid-template-columns:1fr; }
  nav { position:static; height:auto; display:flex; gap:4px; overflow-x:auto; padding:10px; border-right:0; border-bottom:1px solid var(--line); }
  nav .brand, nav .sep, nav .status { display:none; }
  nav a.item { white-space:nowrap; }
  .graphwrap { grid-template-columns:1fr; }
  .kv { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Navigation"></nav>
  <main id="view" aria-live="polite"></main>
</div>
<script>
'use strict';
// Every text below may come from agents, X posts or APIs: it is inserted with textContent only, never as HTML.
const $view = document.getElementById('view');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const lastSeen = Number(store.get('tg.lastSeen')) || 0;      // previous visit, kept for the whole session
store.set('tg.lastSeen', String(Math.floor(Date.now() / 1000)));
const PAGES = [['home', 'Accueil'], ['investigations', 'Enquêtes'], ['alerts', 'Alertes précoces'], ['network', 'Réseaux financiers'],
  ['agents', 'Agents'], ['reports', 'Rapports'], ['commands', 'Commandes'], ['settings', 'Paramètres'], ['raw', 'Données brutes']];

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'href') e.setAttribute('href', safeHref(v));
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : String(v));
  }
  add(e, kids);
  return e;
}
function add(e, kids) { for (const k of kids.flat(Infinity)) { if (k === undefined || k === null || k === false) continue; e.append(k instanceof Node ? k : document.createTextNode(String(k))); } return e; }
function safeHref(u) { u = String(u || ''); return /^(https?:\/\/|#\/|\/api\/)/.test(u) ? u : '#/home'; }
function ext(url, text) { return h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, text || url); }
const isAddr = (v) => /^0x[0-9a-fA-F]{40}$/.test(String(v || ''));
const isTx = (v) => /^0x[0-9a-fA-F]{64}$/.test(String(v || ''));
function short(v) { v = String(v || ''); return v.length > 18 ? v.slice(0, 8) + '…' + v.slice(-6) : v; }
function addr(a) {
  if (!isAddr(a)) return h('code', {}, a || '');
  return h('span', { class: 'row', style: 'gap:4px;display:inline-flex' }, h('a', { href: '#/network?address=' + a, title: a, class: 'mono' }, short(a)),
    h('a', { href: 'https://polygonscan.com/address/' + a, target: '_blank', rel: 'noopener noreferrer', title: 'Polygonscan', class: 'small muted' }, '↗'));
}
function tx(t, chain) { if (!isTx(t)) return h('code', {}, t || '—'); const base = { polygon: 'https://polygonscan.com/tx/', ethereum: 'https://etherscan.io/tx/', base: 'https://basescan.org/tx/', arbitrum: 'https://arbiscan.io/tx/' }[String(chain || 'polygon').toLowerCase()] || 'https://polygonscan.com/tx/'; return h('a', { href: base + t, target: '_blank', rel: 'noopener noreferrer', title: t, class: 'mono' }, short(t)); }
const pad = (n) => String(n).padStart(2, '0');
function when(ts) { if (!ts) return '—'; const d = new Date(Number(ts) * 1000); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function utc(ts) { return ts ? new Date(Number(ts) * 1000).toISOString().replace('T', ' ').replace('.000Z', ' UTC') : '—'; }
function ago(ts) { if (!ts) return 'jamais'; const s = Math.floor(Date.now() / 1000) - Number(ts); if (s < 90) return 'à l\'instant'; if (s < 5400) return 'il y a ' + Math.round(s / 60) + ' min'; if (s < 172800) return 'il y a ' + Math.round(s / 3600) + ' h'; return 'il y a ' + Math.round(s / 86400) + ' j'; }
function dur(s) { if (s === null || s === undefined) return '—'; s = Math.round(s); return s < 120 ? s + ' s' : s < 7200 ? Math.round(s / 60) + ' min' : (s / 3600).toFixed(1) + ' h'; }
function usd(v) { return Math.round(Number(v || 0)).toLocaleString('fr-FR') + ' USDC'; }
function clip(t, n) { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
function empty(text) { return h('div', { class: 'empty' }, text || 'Rien pour l\'instant.'); }
function kv(...items) { return h('div', { class: 'kv' }, items.map(x => h('div', {}, x))); }
function card(title, ...kids) { return h('section', { class: 'card' }, title ? h('h2', {}, title) : null, ...kids); }
function state(s, text) { const m = { ok: ['b-good', '✓'], warn: ['b-warn', '▲'], bad: ['b-bad', '✕'] }[s] || ['', '•']; return h('span', { class: 'badge ' + m[0] }, m[1] + ' ' + (text || s)); }
const STATUS = { queued: ['', 'en file'], running: ['b-warn', 'en cours'], awaiting_external_result: ['b-warn', 'attend un résultat'], reviewing: ['b-accent', 'revue GPT'], done: ['b-good', 'terminée'], failed: ['b-bad', 'échec'], blocked: ['b-bad', 'bloquée'], paused: ['', 'en pause'],
  open: ['b-accent', 'ouverte'], exhausted: ['', 'arrêtée'], closed: ['', 'close'], pending: ['b-warn', 'en attente de GPT'], planned: ['b-good', 'décidée'] };
function status(s) { const m = STATUS[s] || ['', s]; return h('span', { class: 'badge ' + m[0] }, m[1]); }
const IMPORTANCE = { major: ['b-solid-bad', '★ majeur'], normal: ['b-accent', 'découverte'], none: ['', 'sans découverte'] };
function importance(i) { const m = IMPORTANCE[i] || ['', i]; return h('span', { class: 'badge ' + m[0] }, m[1]); }
function tier(t) { return h('span', { class: 'tier t-' + t }, { CONFIRMED: '✓ CONFIRMÉ', SUPPORTED: 'ÉTAYÉ', HYPOTHESIS: 'HYPOTHÈSE', UNRESOLVED: 'NON ÉTABLI', REFUTED: '✕ RÉFUTÉ' }[t] || (t || '')); }
const AGENT = { claude: 'Claude', gpt: 'GPT', grok: 'Grok' };
function table(rows, cols, onclick) {
  if (!rows || !rows.length) return empty();
  return h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, cols.map(c => h('th', { class: c[2] || '' }, c[0])))),
    h('tbody', {}, rows.map(r => h('tr', { class: onclick ? 'click' : '', onclick: onclick ? () => onclick(r) : null }, cols.map(c => h('td', { class: c[2] || '' }, c[1](r))))))));
}
function go(route) { location.hash = '#/' + route; }

async function api(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' : HTTP ' + r.status);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json', 'X-TriAgent-UI': store.get('tg.token') || '' }, body: JSON.stringify(body) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.error || ('HTTP ' + r.status));
  return out;
}

// --- reports: a small Markdown subset, built as DOM (headings, bold labels, lists, `code`, links)
function inline(text) {
  const out = [];
  String(text).split(/(`[^`]+`|\*\*[^*]+\*\*|https?:\/\/[^\s)]+)/).forEach(part => {
    if (!part) return;
    if (part.startsWith('`') && part.endsWith('`')) { const v = part.slice(1, -1); out.push(isTx(v) ? tx(v) : isAddr(v) ? addr(v) : h('code', {}, v)); }
    else if (part.startsWith('**') && part.endsWith('**')) out.push(h('strong', {}, part.slice(2, -2)));
    else if (/^https?:\/\//.test(part)) out.push(ext(part, clip(part, 70)));
    else out.push(part);
  });
  return out;
}
function markdown(body) {
  const root = h('div', { class: 'report' }); let ul = null, sub = null;
  for (const line of String(body || '').split('\n')) {
    if (!line.trim()) { ul = sub = null; continue; }
    if (line.startsWith('### ')) { root.append(h('h3', {}, line.slice(4))); ul = null; continue; }
    if (line.startsWith('  - ') && ul) { if (!sub) { sub = h('ul', {}); (ul.lastChild || ul).append(sub); } sub.append(h('li', {}, inline(line.slice(4)))); continue; }
    if (line.startsWith('- ')) { if (!ul) { ul = h('ul', {}); root.append(ul); } sub = null; ul.append(h('li', {}, inline(line.slice(2)))); continue; }
    ul = sub = null;
    const it = line.startsWith('_') && line.endsWith('_');
    root.append(h('p', { class: it ? 'small muted' : '' }, inline(it ? line.slice(1, -1) : line)));
  }
  return root;
}

// --- navigation
let attentionCount = 0;
function nav(current) {
  const n = document.getElementById('nav'); n.replaceChildren();
  n.append(h('div', { class: 'brand' }, 'Investigation Center', h('small', {}, 'Polymarket · TriAgent')), h('div', { class: 'sep' }));
  PAGES.forEach(([id, label], i) => {
    if (i === 6) n.append(h('div', { class: 'sep' }));
    n.append(h('a', { class: 'item' + (current === id ? ' on' : ''), href: '#/' + id }, label, id === 'home' && attentionCount ? h('span', { class: 'count', title: 'éléments à traiter' }, attentionCount) : null));
  });
  n.append(h('div', { class: 'status', id: 'navstatus' }));
}
function parse() {
  const raw = location.hash.replace(/^#\/?/, '') || 'home';
  const [path, query] = raw.split('?');
  const [page, ...rest] = path.split('/');
  return { page, arg: decodeURIComponent(rest.join('/')), q: Object.fromEntries(new URLSearchParams(query || '')) };
}
let renderId = 0, timer = null;
async function render() {
  const r = parse(), id = ++renderId;
  clearTimeout(timer);
  nav(r.page);
  const fn = ROUTES[r.page] || ROUTES.home;
  try {
    const node = await fn(r);
    if (id !== renderId) return;
    $view.replaceChildren(node);
  } catch (e) {
    if (id !== renderId) return;
    $view.replaceChildren(h('h1', {}, 'Service injoignable'), h('div', { class: 'notice err' }, 'Le serveur TriAgent ne répond pas (' + e.message + '). Les données restent dans la base SQLite ; relancez avec « triagent restart ».'));
  }
  if (['home', 'agents'].includes(r.page) && !document.hidden) timer = setTimeout(() => { if (parse().page === r.page) render(); }, 20000);
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && ['home', 'agents'].includes(parse().page)) render(); });

// --- pages
const ROUTES = {};
ROUTES.home = async () => {
  const d = await api('/api/center/home?since=' + (lastSeen || ''));
  attentionCount = d.attention.length; nav('home');
  const c = d.counts;
  const parts = [];
  parts.push(c.missions_done ? `${c.missions_done} mission(s) terminée(s) et revue(s) par GPT` : 'aucune mission terminée');
  if (c.reports_discovery) parts.push(`${c.reports_discovery} rapport(s) avec découverte${c.reports_major ? `, dont ${c.reports_major} majeur(s)` : ''}`);
  if (c.reports_empty) parts.push(`${c.reports_empty} rapport(s) sans découverte`);
  if (c.links_verified) parts.push(`${c.links_verified} lien(s) financier(s) vérifié(s) par reçu`);
  if (c.refuted) parts.push(`${c.refuted} hypothèse(s) réfutée(s)`);
  parts.push(`${c.alerts_new} nouvelle(s) alerte(s) (signaux non vérifiés)`);
  if (c.missions_failed) parts.push(`${c.missions_failed} mission(s) en échec ou bloquée(s)`);
  const head = lastSeen ? 'Depuis votre dernière consultation (' + ago(d.since) + ', ' + when(d.since) + ')' : 'Sur les dernières 24 heures (première visite depuis ce navigateur)';
  const health = d.health;
  return h('div', {},
    h('div', { class: 'spread' }, h('h1', {}, 'Accueil'), h('span', { class: 'row' }, d.mode === 'live' ? null : h('span', { class: 'badge b-warn' }, '▲ simulation (aucun fournisseur appelé)'), state(d.gate === 'running' ? 'ok' : 'warn', d.gate === 'running' ? 'orchestration active' : d.gate))),
    h('p', { class: 'sub' }, head),
    card(null, h('p', { class: 'lead', style: 'margin:0' }, parts.join(' · ') + '.')),
    h('div', { style: 'height:14px' }),
    h('div', { class: 'tiles' },
      tile(c.investigations_open, 'enquêtes actives sur ' + c.investigations_total),
      tile(d.missions.filter(m => m.status === 'running' || m.status === 'reviewing').length, 'missions en cours'),
      tile(c.reports_major, 'rapports majeurs'),
      tile(c.links_verified, 'liens vérifiés'),
      tile(c.alerts_new, 'nouvelles alertes')),
    h('div', { class: 'grid g2' },

const listInvestigations = ROUTES.investigations;
ROUTES.investigations = (r) => r.arg ? investigationPage(r.arg) : listInvestigations(r);
render();
</script>
