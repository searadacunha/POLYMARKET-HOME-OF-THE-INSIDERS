name: phi-forensics

on:
  push:
    branches: [main]
    paths:
      - 'phi_forensics/**'
      - 'monitoring/**'
      - 'pyproject.toml'
      - 'docs/mcp.md'
      - 'scripts/test_phi_forensics_install.py'
      - 'scripts/test_mcp_client.py'
      - 'scripts/build_mcp_docs.py'
      - '.github/workflows/phi-forensics.yml'
  pull_request:
    paths:
      - 'phi_forensics/**'
      - 'monitoring/**'
      - 'pyproject.toml'
      - 'docs/mcp.md'
      - 'scripts/test_phi_forensics_install.py'
      - 'scripts/test_mcp_client.py'
      - 'scripts/build_mcp_docs.py'
      - '.github/workflows/phi-forensics.yml'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline unit tests of the toolkit
        run: python -B -m unittest discover -s phi_forensics/tests -t . -v

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install coverage.py (test tool only, not a dependency of the package)
        run: python -m pip install coverage==7.17.5
      - name: Statement coverage of phi_forensics by its unit tests
        # The threshold is the coverage measured on 28 November 2026 (98.12 %, 2,231 statements), rounded down.
        run: |
          python -m coverage run --source=phi_forensics --omit='phi_forensics/tests/*' -m unittest discover -s phi_forensics/tests -t .
          python -m coverage report --precision=2 --fail-under=98
      - name: The MCP documentation matches the tool list
        run: python scripts/build_mcp_docs.py --check

  install:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel, install it and use it outside the checkout
        run: python scripts/test_phi_forensics_install.py

  mcp-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Drive the server with the official MCP Python SDK (offline tools only)
        run: |
          python -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install mcp==2.3.0
          "$RUNNER_TEMP/sdk/bin/python" scripts/test_mcp_client.py "$RUNNER_TEMP/mcp-transcript.json" --python python
      - name: Keep the transcript
        if: always()
        run: cat "$RUNNER_TEMP/mcp-transcript.json"
