name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the complete published snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test isolated ChangeNOW collection corrections
        run: python3 investigations/ballon-dor-census/tests/test_changenow_fix.py
      - name: Check C1/C5/C7 research register integrity
        run: |
          python3 research_notes/c5-c7-recovery-overlaps-2026-11-07/verify.py
          python3 research_notes/c1-c7-primary-anchors-2026-11-07/verify.py
      - name: Verify archived forensic tools and experimental adapters
        run: |
          python3 -I research_notes/github-tooling-audit-2026-11-06/verify.py
          python3 -I research_notes/github-tooling-audit-2026-11-06/scripts/test_experiment_c.py
          (cd integrations/forensic-intelligence && python3 -m unittest discover -s tests -v)
      - name: Reproduce Iran Inca and Pulser financial evidence offline
        run: |
          python3 -I research_notes/iran-solana-beneficiary-2026-11-05/verify.py
          python3 -I research_notes/iran-cluster-e-network-2026-11-05/verify.py
          python3 -I research_notes/iran-cluster-e-erratum-2026-11-06/verify.py
          python3 -I research_notes/iran-privacy-cash-sequence-2026-11-06/verify.py
          python3 -I research_notes/iran-privacy-cash-root-2026-11-06/verify.py
          python3 -I research_notes/inca-crosscheck-2026-11-06/verify.py
          python3 -I research_notes/inca-crosscheck-2026-11-06/scripts/test_rules.py
          python3 -I research_notes/inca-bridged-exits-2026-11-06/verify.py
          python3 -I research_notes/inca-bridged-exits-2026-11-06/scripts/test_decoders.py
          python3 -I research_notes/iran-pulser-cashy-crossmarket-2026-11-06/verify.py --source-file research_notes/inca-crosscheck-2026-11-06/data/flows.csv --population-file research_notes/inca-crosscheck-2026-11-06/data/population.json
      - name: Regression tests for fail-closed public evidence scans
        run: python3 -m unittest discover -s scripts -p 'test_audit_public_repository.py' -v
      - name: Audit tracked Python syntax and public research secrets
        run: python3 scripts/audit_public_repository.py
      - name: Verify G38 payout routes with strict transaction-level matching
        run: |
          python3 -I research_notes/g38-proof-tier-audit-2026-11-08/verify.py
          python3 -I research_notes/g38-proof-tier-audit-2026-11-08/test_verify.py
      - name: Test publication safeguards
        run: python3 scripts/test_publication.py
      - name: Preserve accepted README and archived Relay evidence
        env:
          PUBLICATION_TARGET: ${{ github.base_ref || github.ref_name }}
          PUBLICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLICATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--target "$PUBLICATION_TARGET" --candidate HEAD --head "$PUBLICATION_HEAD")
          if [ -n "$PUBLICATION_BASE" ]; then
            args+=(--base-ref "$PUBLICATION_BASE")
          fi
          python3 scripts/check_publication.py "${args[@]}"
      - name: Verify archived Relay trace
        run: python3 research_notes/relay-followup-2026-11-04/verify.py
      - name: Check published research links and checker regressions
        run: |
          python3 scripts/check_research_links.py --self-test
          python3 scripts/check_research_links.py
      - name: Recheck historical X and chain evidence offline
        env:
          XLEADS_RAW: /tmp/phi-no-local-x-raw
        run: |
          python3 research_notes/x-history-2026-11-06/verification/verify.py
          python3 research_notes/x-history-2026-11-06/tools/verify_x_snowflakes.py
          python3 research_notes/x-history-2026-11-06/tools/check_thin_before_snoorrason.py
          python3 research_notes/x-corpus-reconciliation-2026-11-06/tools/check_intake.py
      - name: Cross-check external Polymarket case registry and account overlap
        run: python3 research_notes/external-polymarket-cases-2026-11-07/tools/check_external_cohort.py
      - name: Check new KPMG and XFM research registries
        run: python3 research_notes/kpmg-election-integrity-2026-11-07/tools/check_intake.py
      - name: Replay KPMG handoffs, Railgun tree and pardon deposit offline
        run: python3 research_notes/financial-links-replay-2026-11-07/verify.py
      - name: Test central utilities
        run: python3 scripts/test_phi.py
      - name: Test evidence, import and recovery regressions
        run: python3 scripts/test_integrity_regressions.py
      - name: Test concurrent publication and CI gates
        run: python3 scripts/test_parallel_publication.py
      - name: Validate published evidence and manifests
        run: python3 scripts/validate_evidence.py
      - name: Check generated reports
        run: python3 scripts/build_master_report.py --check
