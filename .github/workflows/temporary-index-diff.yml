name: Temporary generated report diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compare generated reports with committed versions
        run: |
          python3 scripts/build_master_report.py
          git diff --stat -- MASTER_REPORT.md INVENTORY.md
          git diff -- MASTER_REPORT.md INVENTORY.md | sed -n '1,300p'
