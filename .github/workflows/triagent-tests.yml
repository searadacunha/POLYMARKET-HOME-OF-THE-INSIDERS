name: TriAgent prototype tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/triagent/**'
      - '.github/workflows/triagent-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/triagent/**'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_MODE: dryrun
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r automation/triagent/requirements.txt
      - name: Run isolated TriAgent tests
        run: |
          cd automation/triagent
          PYTHONPATH=. python -m unittest discover -s tests -v
