[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-forensics"
version = "0.1.0"
description = "Read-only forensic toolkit and MCP server for on-chain investigation of Polymarket wallets and markets"
readme = "phi_forensics/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Da Cunha" }]
keywords = ["polymarket", "prediction-markets", "blockchain-forensics", "on-chain-analysis", "wallet-clustering", "mcp", "polygon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Repository = "https://github.com/searadacunha/POLYMARKET-HOME-OF-THE-INSIDERS"
Documentation = "https://github.com/searadacunha/POLYMARKET-HOME-OF-THE-INSIDERS/blob/main/docs/mcp.md"

[project.scripts]
phi-forensics = "phi_forensics.cli:main"
phi-forensics-mcp = "phi_forensics.mcp.server:main"

[tool.setuptools]
# Only what phi_forensics imports: the collectors of monitoring/ and every test stay out of the wheel.
packages = ["phi_forensics", "phi_forensics.mcp", "phi_forensics.data", "monitoring", "monitoring.phi_monitor", "monitoring.livecollect"]

[tool.setuptools.package-data]
"phi_forensics.data" = ["*.json"]
