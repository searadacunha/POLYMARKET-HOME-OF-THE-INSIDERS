[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-forensics"
version = "0.1.0"
description = "Read-only forensic toolkit and MCP server for on-chain investigation of Polymarket wallets and markets"
readme = "phi_forensics/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Benjamin Da Cunha" }]
keywords = ["polymarket", "prediction-markets", "blockchain-forensics", "on-chain-analysis", "wallet-clustering",
            "insider-trading-detection", "mcp", "polygon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Repository = "https://github.com/searadacunha/POLYMARKET-HOME-OF-THE-INSIDERS"
Documentation = "https://github.com/searadacunha/POLYMARKET-HOME-OF-THE-INSIDERS/tree/main/docs"

[project.scripts]
phi-forensics = "phi_forensics.cli:main"
phi-forensics-mcp = "phi_forensics.mcp.server:main"

[tool.setuptools.packages.find]
include = ["phi_forensics*", "monitoring*"]
exclude = ["*.tests", "*.tests.*", "monitoring.fixtures*"]
